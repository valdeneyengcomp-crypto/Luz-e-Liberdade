<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A ∴ R ∴ L ∴ S ∴ LUZ E LIBERDADE TUCURUIENSE - N° 1910</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-custom { background: white; border-radius: 0.5rem; border: 1px solid #e5e7eb; transition: all 0.3s; }
        .card-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .border-gold { border-color: #D4AF37; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <nav class="bg-slate-900 text-white p-6 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex flex-col items-center text-center gap-4">
            <div class="flex flex-col items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1CyAHbjIMnVZj5ZPHOiWjFVAnV4uyLlNc" alt="Logo" class="h-28 w-28 object-contain rounded-full border-2 border-gold bg-white shadow-lg">
                <h1 class="text-2xl font-bold border-b-2 border-gold pb-2 px-4">A ∴ R ∴ L ∴ S ∴ LUZ E LIBERDADE TUCURUIENSE - N° 1910</h1>
            </div>
            <div class="flex flex-wrap justify-center gap-6 text-sm uppercase tracking-wider">
                <a href="biblioteca.html" class="hover:text-gold transition">Biblioteca</a>
                <a href="#midia" class="hover:text-gold transition">Galeria</a>
                <a href="#videos" class="hover:text-gold transition">Vídeos</a>
                <a href="#reunioes" class="hover:text-gold transition">Reuniões</a>
                <a href="#membros" class="hover:text-gold transition">Membros</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 space-y-12">
        <!-- Seção Biblioteca -->
        <section id="biblioteca" class="scroll-mt-20">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <span class="w-8 h-1 bg-gold"></span> Biblioteca Digital
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Renderizado pelo media.js -->
            </div>
        </section>

        <!-- Seção Galeria e Vídeos -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <section id="midia" class="scroll-mt-20">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <span class="w-8 h-1 bg-gold"></span> Galeria
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <!-- Renderizado pelo media.js -->
                </div>
            </section>

            <section id="videos" class="scroll-mt-20">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <span class="w-8 h-1 bg-gold"></span> Vídeos
                </h2>
                <div class="grid grid-cols-1 gap-6">
                    <!-- Renderizado pelo media.js -->
                </div>
            </section>
        </div>

        <!-- Seção Reuniões -->
        <section id="reunioes" class="scroll-mt-20 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold mb-8 text-center">Agenda de Reuniões</h2>
            <div class="max-w-xl mx-auto">
                <form id="meeting-form" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                    <input type="text" id="m-local" placeholder="Local da Reunião" class="p-3 border rounded-lg focus:ring-2 focus:ring-slate-900 outline-none" required>
                    <input type="date" id="m-data" class="p-3 border rounded-lg focus:ring-2 focus:ring-slate-900 outline-none" required>
                    <input type="time" id="m-hora" class="p-3 border rounded-lg focus:ring-2 focus:ring-slate-900 outline-none" required>
                    <input type="text" id="m-assunto" placeholder="Assunto / Pauta" class="p-3 border rounded-lg focus:ring-2 focus:ring-slate-900 outline-none" required>
                    <button type="submit" class="md:col-span-2 bg-slate-900 text-white p-3 rounded-lg font-bold hover:bg-slate-800 transition">Agendar Reunião</button>
                </form>
                
                <div id="lista-reunioes" class="space-y-3">
                    <!-- Renderizado pelo meetings.js -->
                </div>
            </div>
        </section>

        <!-- Seção Cadastro de Membros -->
        <section id="membros" class="scroll-mt-20 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold mb-8 text-center">Gestão de Membros</h2>
            <div class="max-w-xl mx-auto">
                <form class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                    <input type="text" placeholder="Nome Completo" class="p-3 border rounded-lg focus:ring-2 focus:ring-slate-900 outline-none">
                    <input type="text" placeholder="Grau / Cargo" class="p-3 border rounded-lg focus:ring-2 focus:ring-slate-900 outline-none">
                    <button type="submit" class="md:col-span-2 bg-slate-900 text-white p-3 rounded-lg font-bold hover:bg-slate-800 transition">Cadastrar Membro</button>
                </form>
                
                <div id="lista-membros" class="space-y-3">
                    <!-- Tabela/Lista será injetada pelo members.js -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/media.js"></script>
    <script src="js/meetings.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
