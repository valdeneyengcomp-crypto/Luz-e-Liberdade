<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Maçonaria Luz e Liberdade Tucuruí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-custom { background: white; border-radius: 0.5rem; border: 1px solid #e5e7eb; transition: all 0.3s; }
        .card-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .border-gold { border-color: #D4AF37; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <nav class="bg-slate-900 text-white p-6 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex flex-col items-center text-center gap-4">
            <div class="flex flex-col items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1CyAHbjIMnVZj5ZPHOiWjFVAnV4uyLlNc" alt="Logo" class="h-28 w-28 object-contain rounded-full border-2 border-gold bg-white shadow-lg">
                <h1 class="text-2xl font-bold border-b-2 border-gold pb-2 px-4">Maçonaria Luz e Liberdade Tucuruí</h1>
            </div>
            <div class="flex justify-center text-sm uppercase tracking-wider">
                <a href="index.html" class="hover:text-gold transition">Voltar ao Início</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 space-y-12">
        <section id="biblioteca" class="scroll-mt-20">
            <h2 class="text-3xl font-bold mb-8 flex items-center justify-center gap-2">
                <span class="w-12 h-1 bg-gold"></span> Biblioteca Digital <span class="w-12 h-1 bg-gold"></span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Renderizado automaticamente pelo media.js -->
            </div>
        </section>
    </main>

    <script src="js/media.js"></script>
</body>
</html>
